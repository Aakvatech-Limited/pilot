name: App assets

on:
  workflow_call:
    inputs:
      frappe-branch:
        description: Frappe branch to build against. Defaults to the pushed branch for version-* branches, else develop.
        type: string
        required: false
        default: ""
      keep:
        description: How many untagged commits' assets to keep on the branch's release. Tagged commits are always kept.
        type: number
        required: false
        default: 30

permissions:
  contents: write

# Pushes in quick succession would race on creating the release.
concurrency:
  group: app-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/checkout@v4
        with:
          repository: frappe/pilot
          path: pilot
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build
        env:
          FRAPPE_BRANCH: ${{ inputs.frappe-branch }}
        run: |
          if [ -z "$FRAPPE_BRANCH" ]; then
            case "$GITHUB_REF_NAME" in
              version-*) FRAPPE_BRANCH="${GITHUB_REF_NAME%-hotfix}" ;;
              *) FRAPPE_BRANCH=develop ;;
            esac
          fi
          pilot/scripts/build-app-assets.sh app "$FRAPPE_BRANCH" dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          tag="assets-${GITHUB_REF_NAME//\//-}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
              --title "Assets for $GITHUB_REF_NAME" --notes "Prebuilt assets that Pilot downloads. Do not edit."
          fi
          gh release upload "$tag" dist/* --clobber

          # Benches run tagged releases long after newer pushes, so their assets stay.
          tagged=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].commit.sha' | tr '\n' ' ')
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | "\(.created_at) \(.id) \(.name)"' \
            | sort -r \
            | awk -v keep="$KEEP" -v tagged="$tagged" '
                BEGIN { split(tagged, shas, " "); for (i in shas) is_tagged[shas[i]] = 1 }
                match($3, /-[0-9a-f]{40}\.tar\.gz/) {
                  sha = substr($3, RSTART + 1, 40)
                  if (sha in is_tagged) next
                  if (!(sha in seen)) { seen[sha] = 1; commits++ }
                  if (commits > keep) print $2
                }' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/{}"
